# Secret scan - the BACKSTOP layer for this repository.
#
# DOCTRINE (ISMS-DOC-042a s2.6). The control that matters is the workstation
# pre-commit hook: a secret that never leaves the machine cannot be scraped off
# GitHub. This job is the second layer, for what the hook cannot cover - a
# commit made with `--no-verify`, a machine that has not converged, or anything
# pushed by automation. The daily org-wide scan (ISMS-DOC-058 s12a layer 3) is
# the third and weakest: it finds a credential the morning AFTER it was
# published. Later layers are backstops, never the answer.
#
# WHY THIS REPOSITORY NEEDS ONE. This repo is the estate's only PUBLIC
# repository, the SSH MCP server every workstation runs; a host, key path or
# token committed here is published to the world at push. ISMS-INC-003 found
# six live credentials in a non-code file. Added 2026-10-13 under ISMS-DOC-058
# s12b: every repository that already runs CI carries this layer.
#
# WHY BOTH `pull_request` AND `push`. Every change here lands by pull request
# (the ruleset carries a `pull_request` rule), so the PR arm is the pre-merge
# half. The push arm re-scans what actually landed on the default branch.
#
# CANON (ISMS-DOC-053 s6a):
#   C1 - push runs keyed by SHA, PR runs by ref, so a merge burst does not become
#        a chain of cancellations.
#   C2 - supersede PR runs only; a push run is never cancelled.
#   C4 - NO `paths:` filter. A path-filtered workflow emits no check-run at all,
#        so a PR outside the filter waits forever on "Expected".
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      self_test:
        description: 'Run the negative control: plant a fixture in-job and require the scanner to flag it'
        type: boolean
        default: false

concurrency:
  group: secret-scan-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  trufflehog:
    # GITHUB-HOSTED, and it must stay so: this repository is PUBLIC and takes
    # pull requests from anyone, so a `pull_request` workflow on a self-hosted
    # runner would execute a stranger's code on our metal (ISMS-DOC-058 F4).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # the action scans the pushed/PR commit range, not the worktree

      # Same shape as arcola-ai-platform's `security-scan.yml` trufflehog job,
      # deliberately: one control, one shape across the estate.
      #
      # `version` has NO `v` prefix. It becomes the DOCKER TAG, and the trufflehog
      # images are published unprefixed - `3.97.1` resolves, `v3.97.1` 404s with an
      # error that reads like an Actions-allowlist problem.
      #
      # PR is scanned WIDER than push (`verified,unknown` vs `only-verified`)
      # because a PR is pre-merge: an unverified candidate is worth a human look
      # before it lands, and is noise afterwards.
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@3bd461f135e30079cb130a54e8264df47ca9999b # v3.99.5
        with:
          version: 3.97.1
          extra_args: ${{ github.event_name == 'pull_request' && '--results=verified,unknown' || '--only-verified' }}
  # --- NEGATIVE CONTROL -------------------------------------------------------
  # A guard that has never gone red is a guard whose red is unproven
  # (`08-technical-self-review.md`, the canary rule). The two arms above are
  # proven to RUN - every push and PR reports success - and were never proven to
  # FAIL, because no fixture had been put in front of one. ISMS-DOC-058 s12b
  # carried that as a stated residual.
  #
  # This job closes it WITHOUT ever committing a secret-shaped string: the
  # fixture is an RSA private key generated INSIDE the job, so it exists only in
  # the runner's temp directory for the life of the run, is a credential to
  # nothing, and appears in no commit, no diff and no log.
  #
  # WHAT IT PROVES, AND WHAT IT DOES NOT - MEASURED, not reasoned
  # (QMS-PRO-010 s7.2).
  #
  # It proves this repository's pinned trufflehog is present, runs, and its
  # DETECTION and finding path work: a planted RSA private key is found.
  #
  # It does NOT prove either live arm above can go red, and that is not a
  # caveat - it was measured on 2026-09-23, on this runner, twice:
  #
  #   run 35799442845  --results=verified,unknown            -> 0 findings
  #   run 35800035082  --results=verified,unknown,unverified -> 1 finding
  #
  # Same fixture (1704 bytes), same image digest, same job. So the PrivateKey
  # detector fires and the finding is categorised UNVERIFIED - which the
  # pull_request arm (`--results=verified,unknown`) and the push arm
  # (`--only-verified`) BOTH exclude by design. A planted key therefore cannot
  # make either arm red.
  #
  # The consequence is worth stating plainly, because it is not what the
  # BACKLOG row assumed: a SAFE negative control cannot prove the live arms'
  # red at all. Only a real, working, verifiable credential could, and planting
  # one is a trade this estate does not make. What is provable safely is what
  # this arm proves - that the scanner and its detectors work - and the gap
  # between the two is the honest residual (ISMS-DOC-058 s12b).
  #
  # This arm therefore runs WIDER than the arms it accompanies, deliberately.
  # Narrowing it to match them would make it fail on a healthy scanner, which
  # is the false red this file exists to avoid.
  #
  # Run it: Actions -> secret-scan -> Run workflow -> self_test = true.
  self-test:
    if: github.event_name == 'workflow_dispatch' && inputs.self_test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Plant an ephemeral private key (generated in-job, never committed)
        run: |
          set -euo pipefail
          d="${RUNNER_TEMP}/secret-scan-selftest"
          rm -rf "$d"; mkdir -p "$d"
          openssl genrsa -out "$d/fixture.pem" 2048 2>/dev/null
          # Assert the INTERVENTION happened. A control that produces no
          # observation must never score as a pass: if the fixture is absent or
          # empty, the scan below would honestly find nothing and we would read
          # that as the scanner being broken.
          test -s "$d/fixture.pem" || { echo "CANNOT MEASURE: the fixture was not written"; exit 1; }
          grep -q 'PRIVATE KEY' "$d/fixture.pem" || { echo "CANNOT MEASURE: the fixture is not a PEM private key"; exit 1; }
          echo "fixture planted: $(wc -c < "$d/fixture.pem") bytes"

      - name: Require the scanner to FLAG it - and tell 'found nothing' from 'could not run'
        env:
          # Pinned by digest, captured live from the registry (never invented -
          # `09-coding-standards.md`). Same MAJOR.MINOR.PATCH as the scanning
          # arms above, so this control exercises the scanner those arms use.
          # renovate: datasource=docker depName=trufflesecurity/trufflehog
          SCAN_IMAGE: "trufflesecurity/trufflehog:3.97.1@sha256:deb2af10659a488a14d262a323addcde099d99827a1cf1dc4e93c17915c39f08"
        run: |
          set -uo pipefail
          d="${RUNNER_TEMP}/secret-scan-selftest"
          err="${RUNNER_TEMP}/th.err"

          out="$(docker run --rm -v "$d:/pwd:ro" "$SCAN_IMAGE" \
                  filesystem /pwd --results=verified,unknown,unverified --json --no-update 2>"$err")"
          rc=$?

          # `grep -c` prints 0 AND exits 1 on no matches, so take the VALUE and
          # never the pipeline's status (`08-technical-self-review.md`).
          n="$(printf '%s' "$out" | grep -c '"DetectorName"' || true)"

          echo "scanner exit=$rc findings=$n"

          # THREE outcomes, not two. A non-zero exit alone is not evidence the
          # scanner fired - a failed image pull, no docker, or an egress refusal
          # is also non-zero, and reading that as a pass is precisely the
          # fail-open this control exists to disprove.
          if [ "$n" -ge 1 ]; then
            echo "SELF-TEST PASSED: the scanner flagged the planted private key ($n finding(s))."
            echo "This arm is the recorded proof that secret-scan's red is reachable."
            exit 0
          fi

          if [ "$rc" -ne 0 ]; then
            echo "CANNOT MEASURE: the scanner did not run to completion (exit $rc) and reported no findings."
            echo "--- scanner stderr ---"; sed -n '1,40p' "$err"
            exit 1
          fi

          echo "SELF-TEST FAILED: the scanner ran cleanly (exit 0) over a planted RSA private key and reported NOTHING."
          echo "That is the failure this control exists to surface - secret-scan cannot be relied on to go red."
          echo "--- scanner stderr ---"; sed -n '1,40p' "$err"
          exit 1
